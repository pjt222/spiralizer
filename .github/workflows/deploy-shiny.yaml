name: Deploy to shinyapps.io

on:
  push:
    branches: [main]
    paths:
      - 'R/**'
      - 'inst/app/**'
      - 'inst/scripts/deploy.R'
      - 'DESCRIPTION'
      - 'renv.lock'
  workflow_dispatch:

# Prevent concurrent deployments to avoid shinyapps.io conflicts
concurrency:
  group: shinyapps-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libglu1-mesa-dev libgl1-mesa-dev

      - name: Setup renv
        uses: r-lib/actions/setup-renv@v2

      - name: Install rsconnect
        run: |
          Rscript -e "install.packages('rsconnect')"

      - name: Deploy to shinyapps.io
        uses: nick-fields/retry@v3
        env:
          SHINYAPPS_ACCOUNT: ${{ secrets.SHINYAPPS_ACCOUNT }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_wait_seconds: 60
          command: Rscript inst/scripts/deploy.R

      - name: Post-deployment stabilization
        run: sleep 30
